name: Android CI & Release Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify APK Exists
        run: |
          ls -la app/build/outputs/apk/release/
          if [ ! -f app/build/outputs/apk/release/app-release.apk ] && [ ! -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlignAI-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "AlignAI Studio Android v1.0.0 (Release)"
          body: |
            ### AlignAI Studio - Android Native Release
            Tự động biên dịch từ mã nguồn gốc iOS với 100% tính năng tương đương:
            - **Jetpack Compose + CameraX**: Kính ngắm 4:3 & 16:9 cố định, Pro Drawer và HUD floating overlay.
            - **AI Target Tracking**: Google ML Kit & TFLite, bộ lọc làm mượt Adaptive 1-Euro Filter + Con quay hồi chuyển Gyroscope.
            - **18 Presets Film Simulation**: Leica Monochrom, Fuji Pro 400H, Kodak Portra 400, Teal & Orange, CineStill 800T...
            - **Pro Video Controls**: Chỉnh tay ISO, Shutter Speed, EV, White Balance, Focus Distance, Focus Peaking.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
